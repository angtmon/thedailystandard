<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#143b31"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Daily Standard"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>The Daily Standard</title><style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color-scheme:dark;--bg:#0c211c;--panel:#15382e;--panel2:#1c4639;--text:#f2f8f3;--muted:#b2c9bb;--accent:#9ce0b7;--line:#315747;--danger:#ffb3a9}body.light{color-scheme:light;--bg:#f4f8f4;--panel:#fff;--panel2:#e9f2eb;--text:#173328;--muted:#526a5b;--accent:#23794d;--line:#d0e1d4;--danger:#ad3939}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:10px 13px;background:var(--accent);color:#09271b;font-weight:700}body.light button{color:#fff}button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}button.ghost{background:transparent;color:var(--muted);padding:6px 9px}button.danger{background:var(--danger);color:#25120f}button:disabled{opacity:.45;cursor:not-allowed}input,textarea,select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-width:0}textarea{resize:vertical}label{display:block;font-size:.87rem;color:var(--muted);margin:8px 0 5px}.app{max-width:760px;margin:auto;padding:18px 16px 105px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px}h1{font-size:1.28rem;margin:0}h2{font-size:1.12rem;margin:0 0 12px}h3{font-size:1rem;margin:0 0 8px}.sub,.muted,small{color:var(--muted)}.sub{font-size:.8rem}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:13px}.row{display:flex;gap:9px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.hidden{display:none!important}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:3px;background:var(--bg);border-top:1px solid var(--line);padding:8px 6px max(9px,env(safe-area-inset-bottom));z-index:10}.tabs button{width:19%;max-width:145px;background:transparent;color:var(--muted);font-size:.75rem;padding:10px 2px}.tabs button.active{background:var(--panel2);color:var(--text)}.progress{height:10px;background:var(--panel2);border-radius:50px;overflow:hidden}.progress>div{height:100%;background:var(--accent);transition:width .2s}.habit{border:1px solid var(--line);padding:12px;border-radius:13px;margin:9px 0}.habit .name{font-weight:700}.pill{display:inline-block;background:var(--panel2);color:var(--muted);border-radius:20px;padding:4px 9px;font-size:.75rem;margin:2px}.quote{font-size:1.07rem;line-height:1.5}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.actions button{font-size:.8rem}.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}.dialog{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:18px}.dialog h2{margin-bottom:10px}.day{border:1px solid var(--line);background:var(--panel2);border-radius:10px;min-height:57px;padding:7px;text-align:center;color:var(--text);font-size:.8rem}.day.selected{outline:2px solid var(--accent)}.day .dot{display:block;margin-top:3px;font-size:.65rem}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.calendar .weekday{text-align:center;font-size:.7rem;color:var(--muted)}.notice{border-left:3px solid var(--accent);padding:9px;background:var(--panel2);border-radius:7px;margin:8px 0}.check{width:22px;height:22px;accent-color:#4baf79}.inline-check{display:flex;align-items:center;gap:9px;margin:8px 0}.inline-check input{width:auto}.stat{font-size:1.6rem;font-weight:800}.section-title{display:flex;justify-content:space-between;align-items:center;margin:15px 0 8px}details{margin:10px 0}summary{cursor:pointer;font-weight:650}.tiny{font-size:.75rem}.truncate{overflow-wrap:anywhere}.empty{padding:16px;text-align:center;color:var(--muted)}.print-only{display:none}@media print{.tabs,header button,.actions,.no-print{display:none!important}body{background:white;color:black}.card{break-inside:avoid;border:1px solid #ccc;background:white;color:black}.app{max-width:none}.print-only{display:block}}
</style></head><body><div class="app"><header><div><h1>✓✓ THE DAILY STANDARD</h1><div class="sub">Set the standard. Live the standard.</div></div><div class="row"><button class="secondary" id="themeBtn" aria-label="Toggle theme">☀︎</button><button class="secondary" id="settingsBtn">⚙</button></div></header><main id="view"></main></div><nav class="tabs" id="tabs"><button data-tab="today">⌂<br>Today</button><button data-tab="quotes">❝<br>Quotes</button><button data-tab="progress">▥<br>Progress</button><button data-tab="reflection">✎<br>Reflect</button><button data-tab="settings">⚙<br>Settings</button></nav><div id="modal" class="modal hidden"><div class="dialog" id="dialog"></div></div><input type="file" id="importFile" accept=".json,application/json" hidden><script>
'use strict';
const KEY='daily-standard-v1', TODAY=()=>new Date().toLocaleDateString('en-CA');
const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defaultData=()=>({version:1,habits:[],records:{},quotes:[],reflections:{},theme:'dark',settings:{startHour:8,endHour:21,reminder:false,showProgress:true,showQuote:true,showVerse:true,showHabits:true,order:['progress','habits','quote','verse']},verseHistory:[],lastVerseWeek:'',milestones:[]});
let data;try{data={...defaultData(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{data=defaultData()}
data.settings={...defaultData().settings,...data.settings};let tab='today',calendarDate=new Date(),selectedDay=TODAY(),quoteFilter='All',quoteSearch='',quoteOnlyFavorites=false,reflectionSearch='',message='',editQuoteId=null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert('Storage could not be saved. Export a backup and free up browser storage.');return false}};
const dateKey=d=>new Date(d+'T12:00:00');const addDays=(s,n)=>{let d=dateKey(s);d.setDate(d.getDate()+n);return d.toLocaleDateString('en-CA')};
const mondayKey=(d=new Date())=>{let x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x.toLocaleDateString('en-CA')};
const verses=[['Joshua 1:9','Be strong and courageous. Do not be afraid; do not be discouraged.','Courage','Take the next right step even when you feel uncertain.'],['James 1:5','If any of you lacks wisdom, you should ask God, who gives generously to all without finding fault.','Wisdom','Seek wisdom before reacting.'],['Galatians 6:9','Let us not become weary in doing good, for at the proper time we will reap a harvest if we do not give up.','Consistency','Keep showing up, even when results are slow.'],['Proverbs 16:3','Commit to the LORD whatever you do, and he will establish your plans.','Purpose','Begin with intention, then do the work.'],['Philippians 4:6','Do not be anxious about anything, but in every situation, by prayer and petition, with thanksgiving, present your requests to God.','Peace','Make space for prayer instead of carrying everything alone.'],['Micah 6:8','Act justly and to love mercy and to walk humbly with your God.','Leadership','Lead with fairness, kindness, and humility.'],['2 Timothy 1:7','For the Spirit God gave us does not make us timid, but gives us power, love and self-discipline.','Confidence','Choose courage and self-discipline in your response.'],['Proverbs 3:5','Trust in the LORD with all your heart and lean not on your own understanding.','Trust','You do not need every answer before moving forward.'],['Romans 12:12','Be joyful in hope, patient in affliction, faithful in prayer.','Resilience','Stay steady through the difficult parts.'],['Colossians 3:23','Whatever you do, work at it with all your heart, as working for the Lord.','Discipline','Bring care and purpose to ordinary work.'],['Psalm 46:10','Be still, and know that I am God.','Stillness','Not every moment requires immediate action.'],['Proverbs 15:1','A gentle answer turns away wrath, but a harsh word stirs up anger.','Leadership','Respond calmly, especially when conversations are hard.']];
// Verse excerpts are stored as short references for prototype; final distribution should use a properly licensed translation or public-domain text.
function weeklyVerse(){const week=mondayKey();if(data.lastVerseWeek!==week){let used=new Set(data.verseHistory.map(x=>x.index));let choices=verses.map((v,i)=>i).filter(i=>!used.has(i));if(!choices.length){data.verseHistory=[];choices=verses.map((v,i)=>i)}let index=choices[(data.verseHistory.length*7+3)%choices.length];data.verseHistory.push({week,index});data.lastVerseWeek=week;save()}return verses[data.verseHistory.at(-1)?.index??0]}
function category(t){t=t.toLowerCase();if(/god|lord|faith|prayer|christ|scripture/.test(t))return 'Faith';if(/lead|integrity|serve|team|mentor/.test(t))return 'Leadership';if(/courage|fear|resilien|setback|uncomfort|adversity/.test(t))return 'Resilience';if(/discipline|consistent|habit|commitment|effort/.test(t))return 'Discipline';if(/confiden|believ|capab/.test(t))return 'Confidence';if(/grow|learn|improv|progress/.test(t))return 'Growth';return 'Mindset'}
function normalizeCategories(){let count={};for(let q of data.quotes){q.category=category(q.text);count[q.category]=(count[q.category]||0)+1}save()}
function schedule(h,date){if(h.archived&&date>=h.archived)return false;if(h.created&&date<h.created)return false;const d=dateKey(date),day=d.getDay();if(h.frequency==='weekly')return true;if(h.frequency==='days')return (h.days||[]).includes(day);return true}
function pauseFor(h,date){return (h.pauses||[]).find(p=>date>=p.start&&(!p.end||date<=p.end))}
function entry(h,date){return data.records[date]?.[h.id]||{value:0,note:''}}
function status(h,date){if(!schedule(h,date))return 'off';if(pauseFor(h,date))return 'paused';let r=entry(h,date);return Number(r.value)>=Number(h.target||1)?'done':Number(r.value)>0?'partial':'missed'}
function dayStats(date){let active=data.habits.filter(h=>schedule(h,date)&&!pauseFor(h,date));let done=active.filter(h=>status(h,date)==='done').length;return {done,total:active.length,pct:active.length?Math.round(done/active.length*100):0}}
function updateEntry(id,date,value,note){let h=data.habits.find(x=>x.id===id);if(!h)return;data.records[date]??={};let old=entry(h,date);data.records[date][id]={value:Math.max(0,Number(value)||0),note:note===undefined?old.note:note};save();render()}
function openModal(html){document.getElementById('dialog').innerHTML=html;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function formValue(id){return document.getElementById(id)?.value||''}
function setTab(t){tab=t;render();window.scrollTo(0,0)}
function habitCard(h,date){const s=status(h,date),r=entry(h,date),paused=pauseFor(h,date);let numeric=h.unit!=='check',val=Number(r.value)||0,goal=Number(h.target)||1;return `<div class="habit"><div class="row between"><div class="grow"><div class="name">${esc(h.name)} ${h.archived?'<span class="pill">Archived</span>':''}</div><small>${paused?'⏸ Paused: '+esc(paused.reason):s==='off'?'Not scheduled':s==='done'?'✓ Completed':numeric?`${val} / ${goal} ${esc(h.unit)}`:'Not completed'}</small></div>${!paused&&s!=='off'&&!h.archived?(numeric?`<button class="secondary" onclick="changeValue('${h.id}','${date}',-${h.step||1})">−</button><button onclick="changeValue('${h.id}','${date}',${h.step||1})">+</button>`:`<input class="check" aria-label="Complete ${esc(h.name)}" type="checkbox" ${s==='done'?'checked':''} onchange="updateEntry('${h.id}','${date}',this.checked?1:0)">`):''}</div>${numeric&&!paused&&s!=='off'?`<div class="progress" style="margin-top:9px"><div style="width:${Math.min(100,Math.round(val/goal*100))}%"></div></div>`:''}<div class="actions"><button class="ghost" onclick="noteModal('${h.id}','${date}')">✎ ${r.note?'Edit note':'Note'}</button><button class="ghost" onclick="habitModal('${h.id}')">Edit</button><button class="ghost" onclick="pauseModal('${h.id}')">${paused?'Pauses':'Pause'}</button><button class="ghost" onclick="archiveHabit('${h.id}')">${h.archived?'Restore':'Archive'}</button></div>${r.note?`<small class="truncate">📝 ${esc(r.note)}</small>`:''}</div>`}
window.changeValue=(id,date,step)=>{let h=data.habits.find(x=>x.id===id);updateEntry(id,date,(Number(entry(h,date).value)||0)+step)};
window.noteModal=(id,date)=>{let h=data.habits.find(x=>x.id===id);openModal(`<h2>Note · ${esc(h.name)}</h2><small>${date}</small><textarea id="note" rows="5">${esc(entry(h,date).note)}</textarea><div class="actions"><button onclick="saveNote('${id}','${date}')">Save note</button><button class="secondary" onclick="closeModal()">Cancel</button></div>`)};
window.saveNote=(id,date)=>{let h=data.habits.find(x=>x.id===id);updateEntry(id,date,entry(h,date).value,formValue('note'));closeModal()};
window.archiveHabit=id=>{let h=data.habits.find(x=>x.id===id);if(h.archived){h.archived=null}else if(confirm('Archive this habit? Its history will be preserved.')){h.archived=TODAY()}save();render()};
window.habitModal=id=>{let h=data.habits.find(x=>x.id===id),v=h||{name:'',unit:'check',target:1,step:1,frequency:'daily',days:[1,2,3,4,5]};openModal(`<h2>${h?'Edit habit':'New habit'}</h2><label>Habit name</label><input id="hName" value="${esc(v.name)}" placeholder="e.g., Reading"><label>Tracking type</label><select id="hUnit" onchange="toggleTarget()"><option value="check" ${v.unit==='check'?'selected':''}>Yes / No</option>${['minutes','pages','steps','ounces','times','miles','custom'].map(x=>`<option ${v.unit===x?'selected':''} value="${x}">${x}</option>`).join('')}</select><div id="targetFields"><label>Target amount</label><input type="number" min="1" step="any" id="hTarget" value="${v.target}"><label>Quick-add increment</label><input type="number" min="0.1" step="any" id="hStep" value="${v.step||1}"></div><label>Schedule</label><select id="hFreq" onchange="toggleDays()"><option value="daily" ${v.frequency==='daily'?'selected':''}>Every day</option><option value="days" ${v.frequency==='days'?'selected':''}>Selected weekdays</option><option value="weekly" ${v.frequency==='weekly'?'selected':''}>Flexible (track on any day)</option></select><div id="daysFields"><div class="row wrap">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map((n,i)=>`<label class="inline-check"><input type="checkbox" name="weekday" value="${i}" ${(v.days||[]).includes(i)?'checked':''}>${n}</label>`).join('')}</div></div><div class="actions"><button onclick="saveHabit('${id||''}')">Save habit</button><button class="secondary" onclick="closeModal()">Cancel</button>${h?`<button class="danger" onclick="deleteHabit('${id}')">Delete permanently</button>`:''}</div>`);toggleTarget();toggleDays()};
window.toggleTarget=()=>{document.getElementById('targetFields').classList.toggle('hidden',formValue('hUnit')==='check')};window.toggleDays=()=>{document.getElementById('daysFields').classList.toggle('hidden',formValue('hFreq')!=='days')};
window.saveHabit=id=>{let name=formValue('hName').trim();if(!name)return alert('Enter a habit name.');let unit=formValue('hUnit'),freq=formValue('hFreq'),days=[...document.querySelectorAll('[name=weekday]:checked')].map(x=>Number(x.value));if(freq==='days'&&!days.length)return alert('Choose at least one day.');let h=data.habits.find(x=>x.id===id);let vals={name,unit,target:unit==='check'?1:Math.max(.01,Number(formValue('hTarget'))||1),step:unit==='check'?1:Math.max(.01,Number(formValue('hStep'))||1),frequency:freq,days};if(h)Object.assign(h,vals);else data.habits.push({id:uid(),created:TODAY(),pauses:[],...vals});save();closeModal();render()};
window.deleteHabit=id=>{if(!confirm('Permanently delete this habit? Historical records will also be removed.'))return;data.habits=data.habits.filter(h=>h.id!==id);for(let d of Object.keys(data.records))delete data.records[d][id];save();closeModal();render()};
window.pauseModal=id=>{let h=data.habits.find(x=>x.id===id);let pauses=(h.pauses||[]).map((p,i)=>`<div class="notice">${esc(p.start)} → ${esc(p.end||'Until resumed')} · ${esc(p.reason)} <button class="ghost" onclick="removePause('${id}',${i})">Remove</button></div>`).join('');openModal(`<h2>Pause · ${esc(h.name)}</h2><label>Reason</label><select id="pReason" onchange="document.getElementById('customReason').classList.toggle('hidden',this.value!=='Other')">${['Vacation','Illness / Recovery','Work commitments','Family / Personal','Rest day','Other'].map(x=>`<option>${x}</option>`).join('')}</select><input id="customReason" class="hidden" placeholder="Specify reason" style="margin-top:8px"><label>Start date</label><input type="date" id="pStart" value="${TODAY()}"><label>End date (inclusive; leave blank until manually resumed)</label><input type="date" id="pEnd"><div class="actions"><button onclick="savePause('${id}')">Pause habit</button><button class="secondary" onclick="closeModal()">Close</button></div>${pauses?'<h3 style="margin-top:18px">Pause history</h3>'+pauses:''}`)};
window.savePause=id=>{let h=data.habits.find(x=>x.id===id),start=formValue('pStart'),end=formValue('pEnd'),reason=formValue('pReason')==='Other'?formValue('customReason').trim():formValue('pReason');if(!start||!reason||(end&&end<start))return alert('Check the dates and reason.');h.pauses??=[];h.pauses.push({start,end,reason});save();closeModal();render()};window.removePause=(id,i)=>{let h=data.habits.find(x=>x.id===id);h.pauses.splice(i,1);save();pauseModal(id);render()};
const section={progress:()=>{let x=dayStats(TODAY());return `<div class="card"><div class="row between"><h2>Today's progress</h2><strong>${x.pct}%</strong></div><div class="progress"><div style="width:${x.pct}%"></div></div><p class="muted tiny">${x.done} of ${x.total} scheduled habits completed</p>${x.total&&x.done===x.total?'<div class="notice">✓ All scheduled habits complete. Great work.</div>':''}</div>`},habits:()=>`<div class="card"><div class="row between"><h2>Today's habits</h2><button onclick="habitModal()">+ Add</button></div>${data.habits.filter(h=>!h.archived).length?data.habits.filter(h=>!h.archived).map(h=>habitCard(h,TODAY())).join(''):'<div class="empty">Start with one habit. Keep it simple.</div>'}</div>`,quote:()=>`<div class="card"><div class="row between"><h2>Daily quote</h2><button class="secondary" onclick="cycleQuote()">Another</button></div>${data.quotes.length?(()=>{let q=data.quotes[quotePosition%data.quotes.length];return `<div class="quote">“${esc(q.text)}”</div><p class="muted">— ${esc(q.author||'Unknown')} <span class="pill">${esc(q.category)}</span></p>`})():'<p class="muted">Add your own quotes in the Quotes tab.</p>'}</div>`,verse:()=>{let v=weeklyVerse();return `<div class="card"><div class="row between"><h2>Verse of the week</h2><span class="pill">New every Monday</span></div><div class="quote">“${esc(v[1])}”</div><p class="muted">${esc(v[0])} · ${esc(v[2])}</p><div class="notice">${esc(v[3])}</div><small>Prototype excerpts; final app requires licensed or public-domain verse text.</small></div>`}};let quotePosition=0;window.cycleQuote=()=>{quotePosition++;render()};
function todayView(){return `<p class="muted">${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})}</p>`+data.settings.order.filter(k=>data.settings['show'+k[0].toUpperCase()+k.slice(1)]!==false).map(k=>section[k]?.()||'').join('')}
function quotesView(){let cats=['All',...new Set(data.quotes.map(q=>q.category))];let shown=data.quotes.filter(q=>(quoteFilter==='All'||q.category===quoteFilter)&&(!quoteOnlyFavorites||q.favorite)&&[q.text,q.author,q.category].join(' ').toLowerCase().includes(quoteSearch.toLowerCase()));return `<div class="card"><h2>Quote library <span class="pill">${data.quotes.length}</span></h2><label>Add a quote</label><textarea id="quoteText" rows="3" placeholder="Paste a quote here"></textarea><input id="quoteAuthor" placeholder="Author / source (optional)" style="margin-top:8px"><div class="actions"><button onclick="addQuote()">Save quote</button><button class="secondary" onclick="bulkModal()">Bulk paste</button><button class="secondary" onclick="exportQuotes()">Export quotes</button></div><p class="muted tiny">Categories are assigned automatically using offline keyword rules. No AI service is connected.</p></div><div class="card"><div class="row"><input id="quoteSearch" value="${esc(quoteSearch)}" placeholder="Search quotes" oninput="quoteSearch=this.value;refreshQuoteList()"><select id="quoteFilter" onchange="quoteFilter=this.value;refreshQuoteList()">${cats.map(c=>`<option ${quoteFilter===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><label class="inline-check"><input id="onlyFav" type="checkbox" ${quoteOnlyFavorites?'checked':''} onchange="quoteOnlyFavorites=this.checked;refreshQuoteList()">Favorites only</label><div id="quoteList">${quoteList(shown)}</div></div>`}
function quoteList(shown){return shown.length?shown.map(q=>`<div class="habit"><div class="quote">“${esc(q.text)}”</div><small>— ${esc(q.author||'Unknown')} · ${esc(q.category)}</small><div class="actions"><button class="ghost" onclick="favoriteQuote('${q.id}')">${q.favorite?'♥ Favorite':'♡ Favorite'}</button><button class="ghost" onclick="editQuote('${q.id}')">Edit</button><button class="ghost" onclick="deleteQuote('${q.id}')">Delete</button></div></div>`).join(''):'<div class="empty">No matching quotes.</div>'}
window.refreshQuoteList=()=>{let shown=data.quotes.filter(q=>(quoteFilter==='All'||q.category===quoteFilter)&&(!quoteOnlyFavorites||q.favorite)&&[q.text,q.author,q.category].join(' ').toLowerCase().includes(quoteSearch.toLowerCase()));document.getElementById('quoteList').innerHTML=quoteList(shown)};
window.addQuote=()=>{let t=formValue('quoteText').trim(),author=formValue('quoteAuthor').trim();if(!t)return;let duplicate=data.quotes.some(q=>q.text.toLowerCase()===t.toLowerCase());if(duplicate)return alert('This quote is already in your library.');data.quotes.push({id:uid(),text:t,author,category:category(t),favorite:false});save();render()};window.favoriteQuote=id=>{let q=data.quotes.find(q=>q.id===id);q.favorite=!q.favorite;save();render()};window.deleteQuote=id=>{if(confirm('Delete this quote?')){data.quotes=data.quotes.filter(q=>q.id!==id);save();render()}};
window.editQuote=id=>{let q=data.quotes.find(q=>q.id===id);openModal(`<h2>Edit quote</h2><textarea id="eqText" rows="5">${esc(q.text)}</textarea><label>Author / source</label><input id="eqAuthor" value="${esc(q.author)}"><div class="actions"><button onclick="saveEditQuote('${id}')">Save</button><button class="secondary" onclick="closeModal()">Cancel</button></div>`)};window.saveEditQuote=id=>{let q=data.quotes.find(q=>q.id===id),t=formValue('eqText').trim();if(!t)return;q.text=t;q.author=formValue('eqAuthor');normalizeCategories();save();closeModal();render()};
function parseQuotes(s){return s.split(/\r?\n/).map(x=>x.trim().replace(/^\s*(?:\d+[.)]|[-•])\s*/,'' )).filter(Boolean).map(x=>{let m=x.match(/^(.*?)\s+[—–]\s+([^—–]+)$/);let t=(m?m[1]:x).replace(/^[“"]|[”"]$/g,'').trim();return {text:t,author:m?m[2].trim():'',category:category(t)}}).filter(x=>x.text)}
window.bulkModal=()=>openModal(`<h2>Bulk import quotes</h2><p class="muted">One quote per line. Optional author: Quote — Author</p><textarea id="bulkText" rows="10" placeholder="Be comfortable being uncomfortable.\nWe become what we think about. — Earl Nightingale"></textarea><div class="actions"><button onclick="previewBulk()">Preview</button><button class="secondary" onclick="closeModal()">Cancel</button></div><div id="bulkPreview"></div>`);
window.previewBulk=()=>{let items=parseQuotes(formValue('bulkText')),seen=new Set(data.quotes.map(q=>q.text.toLowerCase())),unique=[];for(let q of items){if(!seen.has(q.text.toLowerCase())){unique.push(q);seen.add(q.text.toLowerCase())}}window.pendingBulk=unique;document.getElementById('bulkPreview').innerHTML=`<p>${unique.length} new quotes; ${items.length-unique.length} duplicates skipped.</p><div style="max-height:230px;overflow:auto">${unique.map(q=>`<div class="notice">${esc(q.text)} <span class="pill">${esc(q.category)}</span></div>`).join('')}</div><button ${!unique.length?'disabled':''} onclick="commitBulk()">Import ${unique.length} quotes</button>`};window.commitBulk=()=>{data.quotes.push(...(window.pendingBulk||[]).map(q=>({id:uid(),...q,favorite:false})));save();closeModal();render()};
function progressView(){let date=selectedDay,stats=dayStats(date),year=calendarDate.getFullYear(),month=calendarDate.getMonth(),first=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate();let cells=Array(first).fill('<div></div>').concat(Array.from({length:days},(_,i)=>{let ds=`${year}-${String(month+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`,x=dayStats(ds),future=ds>TODAY();return `<button class="day ${ds===selectedDay?'selected':''}" onclick="selectDate('${ds}')">${i+1}<span class="dot">${future?'':x.total?x.pct+'%':'—'}</span></button>`}));let period=[];for(let i=29;i>=0;i--){let d=addDays(TODAY(),-i),s=dayStats(d);if(s.total)period.push(s)}let pct=period.length?Math.round(period.reduce((a,s)=>a+s.pct,0)/period.length):0;return `<div class="grid"><div class="card"><small>Today</small><div class="stat">${dayStats(TODAY()).pct}%</div></div><div class="card"><small>Last 30 days*</small><div class="stat">${pct}%</div></div></div><p class="tiny muted">*Average of days with scheduled habits; paused days excluded. Dates before habit creation are excluded.</p><div class="card"><div class="row between"><button class="secondary" onclick="moveMonth(-1)">‹</button><h2>${calendarDate.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h2><button class="secondary" onclick="moveMonth(1)">›</button></div><div class="calendar">${['S','M','T','W','T','F','S'].map(x=>`<div class="weekday">${x}</div>`).join('')}${cells.join('')}</div></div><div class="card"><div class="row between"><h2>${esc(date)} · ${stats.pct}%</h2><button class="secondary" onclick="selectDate('${TODAY()}')">Today</button></div><p class="muted tiny">Edit past entries here. Archived habits remain visible for historical dates.</p>${data.habits.filter(h=>schedule(h,date)).map(h=>habitCard(h,date)).join('')||'<div class="empty">No scheduled habits for this date.</div>'}</div><div class="card"><h2>Monthly summary</h2>${monthlySummary(year,month)}</div>`}
function monthlySummary(year,month){let arr=[];for(let i=1;i<=new Date(year,month+1,0).getDate();i++){let d=`${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;if(d>TODAY())break;let s=dayStats(d);if(s.total)arr.push(s)}return arr.length?`<p>Average completion: <strong>${Math.round(arr.reduce((a,s)=>a+s.pct,0)/arr.length)}%</strong> across ${arr.length} scheduled days.</p><p>${arr.filter(s=>s.pct===100).length} fully completed days.</p>`:'<p class="muted">No scheduled habit data yet.</p>'}
window.selectDate=s=>{selectedDay=s;render()};window.moveMonth=n=>{calendarDate.setMonth(calendarDate.getMonth()+n);render()};
function reflectionView(){let date=selectedDay;let entries=Object.entries(data.reflections).filter(([d,t])=>t.toLowerCase().includes(reflectionSearch.toLowerCase())||d.includes(reflectionSearch)).sort((a,b)=>b[0].localeCompare(a[0]));return `<div class="card"><h2>Daily reflection</h2><label>Date</label><input type="date" id="reflectionDate" value="${date}" onchange="selectedDay=this.value;render()"><label>Your thoughts (optional)</label><textarea id="reflectionText" rows="7" placeholder="What stood out today?">${esc(data.reflections[date]||'')}</textarea><div class="actions"><button onclick="saveReflection()">Save reflection</button><button class="secondary" onclick="deleteReflection()">Clear this date</button></div></div><div class="card"><h2>Past reflections</h2><input placeholder="Search by keyword or date" value="${esc(reflectionSearch)}" oninput="reflectionSearch=this.value;refreshReflections()"><div id="reflectionList">${reflectionList(entries)}</div></div>`}
function reflectionList(entries){return entries.length?entries.map(([d,t])=>`<div class="habit" onclick="selectReflection('${d}')" style="cursor:pointer"><strong>${d}</strong><p class="muted truncate">${esc(t.slice(0,180))}${t.length>180?'…':''}</p></div>`).join(''):'<div class="empty">No reflections yet.</div>'}
window.refreshReflections=()=>{document.getElementById('reflectionList').innerHTML=reflectionList(Object.entries(data.reflections).filter(([d,t])=>t.toLowerCase().includes(reflectionSearch.toLowerCase())||d.includes(reflectionSearch)).sort((a,b)=>b[0].localeCompare(a[0])))};window.selectReflection=d=>{selectedDay=d;render()};window.saveReflection=()=>{let t=formValue('reflectionText').trim();if(t)data.reflections[selectedDay]=t;else delete data.reflections[selectedDay];save();render()};window.deleteReflection=()=>{if(confirm('Clear reflection for this date?')){delete data.reflections[selectedDay];save();render()}};
function settingsView(){return `<div class="card"><h2>Dashboard</h2><p class="muted tiny">Choose what appears on Today and change the order.</p>${data.settings.order.map((k,i)=>`<div class="row between habit"><label class="inline-check"><input type="checkbox" ${data.settings['show'+k[0].toUpperCase()+k.slice(1)]?'checked':''} onchange="toggleSection('${k}',this.checked)">${({progress:'Progress',habits:'Habits',quote:'Daily quote',verse:'Weekly Bible verse'})[k]}</label><div class="row"><button class="secondary" onclick="moveSection('${k}',-1)" ${i===0?'disabled':''}>↑</button><button class="secondary" onclick="moveSection('${k}',1)" ${i===3?'disabled':''}>↓</button></div></div>`).join('')}</div><div class="card"><h2>Reminder preferences</h2><p class="muted tiny">Background hourly reminders are not available in this static app. These settings control optional reminders while the app is open.</p><label class="inline-check"><input type="checkbox" id="reminders" ${data.settings.reminder?'checked':''} onchange="data.settings.reminder=this.checked;save();configureReminder()">Enable in-app hourly reminders</label><label>Start hour (0–23)</label><input type="number" min="0" max="23" id="startHour" value="${data.settings.startHour}" onchange="saveHours()"><label>End hour (0–23)</label><input type="number" min="0" max="23" id="endHour" value="${data.settings.endHour}" onchange="saveHours()"></div><div class="card"><h2>Export & backup</h2><p class="muted tiny">Data is stored locally on this device/browser. Export regularly; clearing browser data can erase it.</p><div class="actions"><button onclick="exportJSON()">Full backup (.json)</button><button class="secondary" onclick="document.getElementById('importFile').click()">Restore backup</button><button class="secondary" onclick="exportCSV()">Habit history (.csv)</button><button class="secondary" onclick="exportQuotes()">Quotes (.csv)</button><button class="secondary" onclick="printReport()">Print / save PDF</button></div></div><div class="card"><h2>Archived habits</h2>${data.habits.filter(h=>h.archived).map(h=>`<div class="row between habit"><span>${esc(h.name)}</span><button class="secondary" onclick="archiveHabit('${h.id}')">Reactivate</button></div>`).join('')||'<p class="muted">No archived habits.</p>'}</div><div class="card"><h2>Weekly verse history</h2>${data.verseHistory.slice().reverse().map(x=>`<div class="habit"><strong>${x.week}</strong> · ${esc(verses[x.index]?.[0]||'')}</div>`).join('')||'<p class="muted">No history yet.</p>'}</div><div class="card"><h2>About</h2><p class="muted tiny">The Daily Standard · Offline-first prototype. No account or analytics. Automatic quote categories use simple keyword rules, not AI. No background push notifications or secure app lock.</p></div>`}
window.toggleSection=(k,v)=>{data.settings['show'+k[0].toUpperCase()+k.slice(1)]=v;save()};window.moveSection=(k,n)=>{let a=data.settings.order,i=a.indexOf(k),j=i+n;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();render()};window.saveHours=()=>{data.settings.startHour=Math.max(0,Math.min(23,Number(formValue('startHour'))||0));data.settings.endHour=Math.max(0,Math.min(23,Number(formValue('endHour'))||0));save()};
let reminderTimer;window.configureReminder=()=>{clearInterval(reminderTimer);if(!data.settings.reminder)return;reminderTimer=setInterval(()=>{let now=new Date(),hour=now.getHours(),s=dayStats(TODAY());if(hour>=data.settings.startHour&&hour<=data.settings.endHour&&s.total&&s.done<s.total&&now.getMinutes()===0){alert('The Daily Standard: You still have habits to complete today. '+(data.quotes[0]?.text||'Keep showing up.'))}},60000)};
function download(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
window.exportJSON=()=>download('daily-standard-backup-'+TODAY()+'.json',JSON.stringify(data,null,2),'application/json');const csvCell=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
window.exportCSV=()=>{let rows=[['Date','Habit','Value','Target','Unit','Status','Note']];for(let d of Object.keys(data.records).sort())for(let h of data.habits){let r=data.records[d]?.[h.id];if(r)rows.push([d,h.name,r.value,h.target,h.unit,status(h,d),r.note])}download('daily-standard-habits-'+TODAY()+'.csv',rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8')};
window.exportQuotes=()=>{let rows=[['Quote','Author','Category','Favorite'],...data.quotes.map(q=>[q.text,q.author,q.category,q.favorite?'Yes':'No'])];download('daily-standard-quotes-'+TODAY()+'.csv',rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8')};
window.printReport=()=>{let html=`<h1>The Daily Standard · Progress Report</h1><p>Generated ${TODAY()}</p><h2>Last 30 days</h2>`;for(let i=29;i>=0;i--){let d=addDays(TODAY(),-i),s=dayStats(d);if(s.total)html+=`<p>${d}: ${s.done}/${s.total} (${s.pct}%)</p>`}openModal(`<div class="print-only">${html}</div><h2>Save a PDF report</h2><p>Use your browser's Print function, then select Save as PDF. The report is generated from your saved habit records.</p><div class="actions"><button onclick="printFullReport()">Open printable report</button><button class="secondary" onclick="closeModal()">Cancel</button></div>`)};
window.printFullReport=()=>{let rows=[];for(let i=29;i>=0;i--){let d=addDays(TODAY(),-i),s=dayStats(d);if(s.total)rows.push(`<tr><td>${d}</td><td>${s.done}</td><td>${s.total}</td><td>${s.pct}%</td></tr>`)}let w=window.open('','_blank');if(!w)return alert('Allow popups to print the report.');w.document.write(`<!doctype html><title>Daily Standard Report</title><style>body{font:16px system-ui;padding:30px}table{border-collapse:collapse;width:100%}td,th{padding:8px;border:1px solid #bbb}</style><h1>The Daily Standard</h1><h2>Last 30 Days</h2><p>Generated ${TODAY()}</p><table><tr><th>Date</th><th>Completed</th><th>Scheduled</th><th>Rate</th></tr>${rows.join('')}</table><p>Paused days excluded from scheduled counts.</p>`);w.document.close();setTimeout(()=>w.print(),350);closeModal()};
document.getElementById('importFile').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!d||!Array.isArray(d.habits)||!Array.isArray(d.quotes)||typeof d.records!=='object'||!d.records||typeof d.reflections!=='object'||!d.reflections)throw Error('Invalid backup structure');if(!confirm('Restore this backup? This REPLACES all data currently stored in this browser. Export your current data first.'))return;data={...defaultData(),...d,settings:{...defaultData().settings,...d.settings}};save();render();alert('Backup restored successfully.')}catch(err){alert('Could not restore backup: '+err.message)}finally{e.target.value=''}});
function render(){document.body.classList.toggle('light',data.theme==='light');document.getElementById('themeBtn').textContent=data.theme==='light'?'☾':'☀︎';document.getElementById('view').innerHTML=({today:todayView,quotes:quotesView,progress:progressView,reflection:reflectionView,settings:settingsView})[tab]();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}
document.getElementById('tabs').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b)setTab(b.dataset.tab)});document.getElementById('settingsBtn').onclick=()=>setTab('settings');document.getElementById('themeBtn').onclick=()=>{data.theme=data.theme==='dark'?'light':'dark';save();render()};document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});window.closeModal=closeModal;window.render=render;weeklyVerse();render();configureReminder();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
